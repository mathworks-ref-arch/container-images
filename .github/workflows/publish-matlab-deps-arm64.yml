# This file builds and publishes the matlab-deps-arm64 images to the GitHub Container Registry.

name: Build and Publish MATLAB Dependencies images for ARM64

on:
  workflow_dispatch:

  # Runs at 02:00 every Monday
  schedule:
    - cron: "0 2 * * 1"

  push:
    branches: ["main"]
    paths:
      - ".github/workflows/publish-matlab-deps-arm64.yml"
      - "matlab-deps/r2026a/**"
      - "matlab-deps/r2026b/**"

env:
  image_name: ghcr.io/${{ github.repository }}/matlab-deps-arm64
  latest_release: r2026b
  releases: '[
    { "release": "r2026a", "default_os": "ubuntu24.04", "supported_os": ["ubuntu22.04", "ubuntu24.04"]},
    { "release": "r2026b", "default_os": "ubuntu26.04", "supported_os": ["aws-batch", "ubi8", "ubi9", "ubuntu22.04", "ubuntu24.04", "ubuntu26.04", "debian12", "debian13"]}
    ]'

jobs:
  generate-inputs:
    runs-on: ubuntu-latest

    permissions: {}

    outputs:
      image_input_data: ${{ steps.gen-json-list.outputs.image_input_data }}
      latest_release: ${{ env.latest_release }}

    steps:
      - name: Generate JSON list of inputs to build and test images
        id: gen-json-list
        env:
          releases: ${{ env.releases }}
        run: |
          list=$(echo ${releases} | jq -c '[.[] | .supported_os[] as $os | {
            release_tag: .release,
            os_info_tag: $os,
            default_os: .default_os,
          }]')
          echo "image_input_data=$list" >> "$GITHUB_OUTPUT"

  build-and-push:
    runs-on: ubuntu-24.04-arm
    needs: generate-inputs
    strategy:
      fail-fast: false
      matrix:
        image_input_data: ${{ fromJson(needs.generate-inputs.outputs.image_input_data) }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      
      - name: Generate Image Tags
        id: image_name_tags
        uses: ./.github/actions/gen-image-tags
        with:
          image_name: ${{ env.image_name }}
          release_tag: ${{ matrix.image_input_data.release_tag }}
          os_info_tag: ${{ matrix.image_input_data.os_info_tag }}
          is_default_os: ${{ matrix.image_input_data.os_info_tag == matrix.image_input_data.default_os }}
          should_add_latest_tag: false
      
      - name: Push Image
        uses: docker/build-push-action@v7
        with:
          context: "./matlab-deps/${{ matrix.image_input_data.release_tag }}/${{ matrix.image_input_data.os_info_tag }}"
          platforms: linux/arm64
          push: true
          tags: ${{ steps.image_name_tags.outputs.image_name_tags }}
